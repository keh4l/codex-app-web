<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>登录 · Codex</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f3;
        --card-bg: #ffffff;
        --text: #1a1a1a;
        --text-muted: #6f6f6f;
        --border: #dcdcda;
        --accent: #1a1a1a;
        --accent-text: #ffffff;
        --error: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181818;
          --card-bg: #222222;
          --text: #ececec;
          --text-muted: #9a9a9a;
          --border: #3a3a3a;
          --accent: #ececec;
          --accent-text: #181818;
          --error: #e57368;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      form.card {
        width: min(360px, calc(100vw - 48px));
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
        margin: 0 auto 4px;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
      }
      p.sub {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--text-muted);
        text-align: center;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
      }
      input:focus {
        border-color: var(--text-muted);
      }
      button {
        margin-top: 4px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-text);
        background: var(--accent);
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      p.error {
        margin: 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--error);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <form class="card" autocomplete="on">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M7 8.5 10.5 12 7 15.5M12.5 15.5H17"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect
          x="2.75"
          y="3.75"
          width="18.5"
          height="16.5"
          rx="4"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>
      <h1>Codex</h1>
      <p class="sub">请登录以继续使用 codex-web</p>
      <input
        name="username"
        autocomplete="username"
        placeholder="用户名"
        value="__DEFAULT_USERNAME__"
        required
      />
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        placeholder="密码"
        required
        autofocus
      />
      <button type="submit">登录</button>
      <p class="error" role="alert"></p>
    </form>
    <script>
      const form = document.querySelector("form");
      const submitButton = form.querySelector("button");
      const errorEl = form.querySelector(".error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.textContent = "";
        submitButton.disabled = true;
        const data = new FormData(form);
        let response = null;
        try {
          response = await fetch("/__auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: data.get("username"),
              password: data.get("password"),
            }),
          });
        } catch {
          // fall through to the generic error below
        }
        if (response && response.ok) {
          // Resolve `next` against our own origin and only honor same-origin
          // targets. A naive startsWith("/") check is bypassable: the browser
          // normalizes backslashes, so "/\evil.com" parses as "//evil.com"
          // (an off-site redirect).
          const raw = new URLSearchParams(location.search).get("next") || "/";
          let dest = "/";
          try {
            const target = new URL(raw, location.origin);
            if (target.origin === location.origin) {
              dest = target.pathname + target.search + target.hash;
            }
          } catch {
            // malformed next; fall back to "/"
          }
          location.replace(dest);
          return;
        }
        submitButton.disabled = false;
        errorEl.textContent =
          response && response.status === 429
            ? "尝试次数过多，请 15 分钟后再试"
            : response
              ? "用户名或密码错误"
              : "网络错误，请重试";
      });
    </script>
  </body>
</html>
